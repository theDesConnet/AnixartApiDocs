/auth/checkLogin:
  post:
    tags:
    - Авторизация
    operationId: Auth_checkLogin
    summary: Проверить доступность логина
    description: Проверить доступность логина. Тело запроса передаётся как `application/x-www-form-urlencoded`.
    x-client-methods:
    - AuthApi.checkLogin
    responses:
      '200':
        description: Запрос выполнен.
        content:
          application/json:
            schema:
              $ref: ../components/auth.yaml#/CheckLoginResponse
      default:
        description: Ошибка запроса или серверное ограничение. Код результата передаётся в поле `code` ответа, если оно предусмотрено
          схемой.
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              login:
                type: string
/auth/firebase:
  post:
    tags:
    - Авторизация
    operationId: Auth_firebase
    summary: Получить Firebase topic для уведомлений
    description: Получить Firebase topic для уведомлений. При заданном токене запрос выполняется в контексте текущего профиля.
    x-client-methods:
    - AuthApi.firebase
    responses:
      '200':
        description: Запрос выполнен.
        content:
          application/json:
            schema:
              $ref: ../components/notifications.yaml#/FirebaseResponse
      default:
        description: Ошибка запроса или серверное ограничение. Код результата передаётся в поле `code` ответа, если оно предусмотрено
          схемой.
    security:
    - AnixartToken: []
    - {}
/auth/google:
  post:
    tags:
    - Авторизация
    operationId: Auth_signInWithGoogle
    summary: Войти через Google
    description: Войти через Google. Тело запроса передаётся как `application/x-www-form-urlencoded`.
    x-client-methods:
    - AuthApi.signInWithGoogle
    - AuthApi.signUpWithGoogle
    responses:
      '200':
        description: Запрос выполнен.
        content:
          application/json:
