/filter/{page}:
  post:
    tags:
    - Релизы
    operationId: Filter_filter
    summary: Отфильтровать релизы
    description: 'Отфильтровать релизы. Выдача постраничная; `page` начинается с `0`. Тело запроса: `FilterRequest` (`application/json`).
      При заданном токене запрос выполняется в контексте текущего профиля.'
    x-client-methods:
    - FilterApi.filter
    parameters:
    - name: page
      in: path
      required: true
      description: Номер страницы, начиная с `0`.
      schema:
        type: integer
        format: int32
        minimum: 0
    - name: extended_mode
      in: query
      required: false
      description: Включает расширенный режим ответа или фильтрации.
      schema:
        type:
        - boolean
        - 'null'
    responses:
      '200':
        description: Запрос выполнен.
        content:
          application/json:
            schema:
              $ref: ../components/pagination.yaml#/PageOfRelease
      default:
        description: Ошибка запроса или серверное ограничение. Код результата передаётся в поле `code` ответа, если оно предусмотрено
          схемой.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/releases.yaml#/FilterRequest
    security:
    - AnixartToken: []
    - {}
    x-original-tags:
    - Фильтр релизов
