      schema:
        type: integer
        format: int32
    - name: is_beta
      in: query
      required: false
      description: Признак beta-сборки.
      schema:
        type: boolean
    responses:
      '200':
        description: Запрос выполнен.
        content:
          application/json:
            schema:
              $ref: ../components/config.yaml#/ConfigUrlsResponse
      default:
        description: Ошибка запроса или серверное ограничение. Код результата передаётся в поле `code` ответа, если оно предусмотрено
