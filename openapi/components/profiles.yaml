Badge:
  type: object
  description: Значок, отображаемый рядом с профилем.
  properties:
    image_url:
      type: string
      description: URL изображения или анимации значка.
    id:
      type: integer
      format: int64
      description: Уникальный идентификатор.
    name:
      type: string
      description: Отображаемое название.
    timestamp:
      type: integer
      format: int64
      description: Временная метка.
    type:
      type: integer
      format: int32
      description: 'Тип значка: статический (`0`) или анимированный (`1`).'
  x-response-constants:
  - name: TYPE_ANIMATION
    type: int
    value: 1
  - name: TYPE_STATIC
    type: int
    value: 0
Profile:
  type: object
  description: Полная модель профиля пользователя.
  properties:
    badge:
      $ref: '#/Badge'
      description: Значок, выбранный для профиля.
    badge_id:
      type:
      - integer
      - 'null'
      format: int64
      description: Идентификатор значка.
    badge_name:
      type: string
      description: Отображаемое название значка.
    badge_type:
      type:
      - integer
      - 'null'
      format: int32
      description: Тип значка (статический или анимированный).
    badge_url:
      type: string
      description: URL изображения или анимации значка.
    ban_expires:
      type: integer
      format: int64
      description: Временная метка «ban expires» в формате API.
    ban_reason:
      type: string
      description: Причина блокировки.
    added_date:
      type: integer
      format: int64
      description: Время добавления профиля в чёрный список.
    collection_count:
      type: integer
      format: int32
      description: Количество коллекций.
    collections_preview:
      type: array
      items:
        $ref: ./collections.yaml#/Collection
      description: Коллекции, показанные в превью профиля.
    comment_count:
      type: integer
      format: int32
      description: Количество комментариев.
    comments_preview:
      type: array
      items:
        $ref: ./comments.yaml#/Comment
        x-generic-arguments:
        - '? extends ProfileCompact'
      description: Комментарии, показанные в превью профиля.
    completed_count:
      type: integer
      format: int32
      description: Количество профилей со статусом «Просмотрено».
    deletion_delete_at:
      type: integer
      format: int64
      description: Планируемое время окончательного удаления аккаунта.
    deletion_requested_at:
      type: integer
      format: int64
      description: Время, когда было запрошено удаление аккаунта.
    dropped_count:
      type: integer
      format: int32
      description: Количество профилей со статусом «Брошено».
    favorite_count:
      type: integer
      format: int32
      description: Количество добавлений в избранное.
    friend_count:
      type: integer
      format: int32
      description: Количество друзей профиля.
    friend_status:
      $ref: ./enums.yaml#/Profile_FriendStatus
      description: Текущее состояние дружбы или заявки между профилями.
    friends_preview:
      type: array
      items:
        $ref: '#/Profile'
      description: Друзья, показанные в превью профиля.
    history:
      type: array
      items:
        $ref: ./releases.yaml#/Release
      description: Недавняя история просмотров профиля.
    hold_on_count:
      type: integer
      format: int32
      description: Количество профилей со статусом «Отложено».
    id:
      type: integer
      format: int64
      description: Уникальный идентификатор.
    is_banned:
      type: boolean
      description: Профиль заблокирован.
    is_blocked:
      type: boolean
      description: Объект заблокирован для текущего профиля.
    is_comment_notifications_enabled:
      type: boolean
      description: Уведомления о комментариях включены.
    is_counts_hidden:
      type: boolean
      description: Счётчики профиля скрыты от других пользователей.
    is_deleted:
      type: boolean
      description: Объект помечен удалённым.
    is_deletion_requested:
      type: boolean
      description: Для аккаунта уже запрошено удаление.
    is_episode_notifications_enabled:
      type: boolean
      description: Уведомления о новых эпизодах включены.
    is_first_episode_notification_enabled:
      type: boolean
      description: Уведомление о первом эпизоде включено.
    is_friend_requests_disallowed:
      type: boolean
      description: Новые заявки в друзья запрещены настройками профиля.
    is_google_bound:
      type: boolean
      description: К профилю привязан Google-аккаунт.
    is_incognito:
      type: boolean
      description: Для профиля включён режим инкогнито.
    is_login_changed:
      type: boolean
      description: Логин профиля уже менялся.
    is_me_blocked:
      type: boolean
      description: Целевой профиль заблокировал текущий профиль.
    is_online:
      type: boolean
      description: Профиль сейчас отмечен онлайн.
    is_perm_banned:
      type: boolean
      description: Профиль заблокирован без ограничения по сроку.
    is_social:
      type: boolean
      description: Профиль участвует в социальных функциях клиента.
    is_social_hidden:
      type: boolean
      description: Социальные ссылки профиля скрыты.
    is_sponsor:
      type: boolean
      description: У профиля активен статус спонсора.
    is_stats_hidden:
      type: boolean
      description: Статистика профиля скрыта.
    is_telegram_bound:
      type: boolean
      description: К профилю привязан Telegram.
    is_verified:
      type: boolean
      description: Профиль/канал подтверждён.
    is_vk_bound:
      type: boolean
      description: К профилю привязан VK.
    is_yandex_bound:
      type: boolean
      description: К профилю привязан Yandex.
    last_activity_time:
      type: integer
      format: int64
      description: Время последней активности профиля в формате API.
    pinned_section_id:
      type: integer
      format: int32
      description: Идентификатор закреплённого раздела.
    plan_count:
      type: integer
      format: int32
      description: Количество профилей со статусом «В планах».
    preferred_audiences:
      type: array
      items:
        $ref: '#/ProfileGenre'
      description: Предпочитаемые возрастные/аудиторные категории профиля.
    preferred_genres:
      type: array
      items:
        $ref: '#/ProfileGenre'
      description: Предпочитаемые жанры профиля.
    preferred_themes:
      type: array
      items:
        $ref: '#/ProfileGenre'
      description: Предпочитаемые тематические категории профиля.
    privilege_level:
      type: integer
      format: int64
      description: Уровень системных привилегий профиля.
    rating_score:
      type: integer
      format: int32
      description: Репутация/рейтинговый балл профиля.
    register_date:
      type: integer
      format: int64
      description: Время регистрации профиля в формате API.
    release_videos_preview:
      type: array
      items:
        $ref: ./video.yaml#/ReleaseVideo
      description: Пользовательские видео, показанные в превью профиля.
    roles:
      type: array
      items:
        $ref: '#/RoleDto'
      description: Роли профиля.
    sponsorship_expires:
      type: integer
      format: int64
      description: Временная метка «sponsorship expires» в формате API.
    theme_animation_enabled:
      type:
      - boolean
      - 'null'
      description: Анимации темы включены.
    theme_animation_speed:
      $ref: ./enums.yaml#/ThemedContainerLayout_AnimationSpeed
      description: Скорость анимации элементов темы.
    theme_background_alpha:
      type:
      - number
      - 'null'
      format: float
      description: Прозрачность фонового изображения темы.
    theme_background_mode:
      $ref: ./enums.yaml#/ThemedContainerLayout_BackgroundMode
      description: Способ масштабирования или повторения фонового изображения.
    theme_background_url:
      type: string
      description: URL фонового изображения темы.
    theme_enabled:
      type:
      - boolean
      - 'null'
      description: Тема доступна для выбора.
    theme_gradient_angle:
      $ref: ./enums.yaml#/ThemedContainerLayout_GradientAngle
      description: Направление или тип фонового градиента.
    theme_gradient_end_color:
      type: string
      description: Конечный цвет градиента.
    theme_gradient_start_color:
      type: string
      description: Начальный цвет градиента.
    theme_icon_alpha:
      type:
      - number
      - 'null'
      format: float
      description: Прозрачность декоративных иконок темы.
    theme_icon_color:
      type: string
      description: Цвет декоративных иконок темы.
    theme_icon_density:
      $ref: ./enums.yaml#/ThemedContainerLayout_IconDensity
      description: Плотность декоративных иконок.
    theme_icon_res_name:
      type: string
      description: Имя встроенного Android-ресурса декоративной иконки.
    theme_icon_size:
      $ref: ./enums.yaml#/ThemedContainerLayout_IconSize
      description: Размер декоративных иконок.
    theme_icon_url:
      type: string
      description: URL внешнего набора/изображения иконок темы.
    video_count:
      type: integer
      format: int32
      description: Количество пользовательских видео профиля.
    vote:
      type: integer
      format: int32
      description: Числовое значение пользовательского голоса/оценки в контексте профиля.
    votes:
      type: array
      items:
        $ref: ./releases.yaml#/Release
      description: Релизы/объекты, связанные с голосованием профиля.
    watch_dynamics:
      type: array
      items:
        $ref: '#/ProfileWatchDynamics'
      description: Динамика просмотров профиля по временным интервалам.
    watched_episode_count:
      type: integer
      format: int64
      description: Общее количество просмотренных эпизодов.
    watched_time:
      type: integer
      format: int64
      description: Суммарное время просмотра, накопленное профилем, в единицах API.
    watching_count:
      type: integer
      format: int32
      description: Количество профилей со статусом «Смотрю».
    login:
      type: string
      description: Логин профиля.
    password:
      type: string
      description: Пароль или его представление в запросе.
    avatar:
      type: string
      description: URL или идентификатор изображения профиля.
    status:
      type: string
      description: Текстовый статус профиля.
    vk_page:
      type: string
      description: Ссылка или идентификатор страницы VK.
    tg_page:
      type: string
      description: Ссылка или имя пользователя Telegram.
    inst_page:
      type: string
      description: Ссылка или имя профиля Instagram.
    tt_page:
      type: string
      description: Ссылка или имя профиля TikTok.
    discord_page:
      type: string
      description: Ссылка или имя пользователя Discord.
  x-response-constants:
  - name: ADMINISTRATOR
    type: long
    value: 4
  - name: DEVELOPER
    type: long
    value: 5
  - name: MEMBER
    type: long
    value: 1
  - name: MODERATOR
    type: long
    value: 3
  - name: NONE
    type: long
    value: 0
  - name: RELEASER
    type: long
    value: 2
ProfileArticleNotification:
  allOf:
  - $ref: ./notifications.yaml#/ProfileNotification
  - type: object
    properties:
      article:
        $ref: ./articles.yaml#/ArticleCompact
        description: Связанная статья.
ProfileBadgePageableResponse:
  allOf:
  - $ref: ./pagination.yaml#/PageableResponse
  - type: object
    properties:
      content:
        type: array
        items:
          $ref: '#/Badge'
        description: Значки на текущей странице.
      profile:
        $ref: '#/Profile'
        description: Профиль, для которого загружен список доступных значков.
    description: Страница доступных значков вместе с данными текущего профиля.
ProfileCompact:
  type: object
  description: Компактное представление профиля для списков, комментариев и уведомлений.
  properties:
    badge_id:
      type:
      - integer
      - 'null'
      format: int64
      description: Идентификатор связанного объекта «badge».
    badge_name:
      type: string
      description: Отображаемое название значка.
    badge_type:
      type:
      - integer
      - 'null'
      format: int32
      description: Тип значка (статический или анимированный).
    badge_url:
      type: string
      description: URL изображения или анимации значка.
    ban_expires:
      type: integer
      format: int64
      description: Временная метка «ban expires» в формате API.
    ban_reason:
      type: string
      description: Причина блокировки.
    id:
      type: integer
      format: int64
      description: Уникальный идентификатор.
    is_banned:
      type: boolean
      description: Профиль заблокирован.
    is_sponsor:
      type: boolean
      description: У профиля активен статус спонсора.
    is_verified:
      type: boolean
      description: Профиль/канал подтверждён.
    privilege_level:
      type: integer
      format: int64
      description: Уровень системных привилегий профиля.
    login:
      type: string
      description: Логин профиля.
    avatar:
      type: string
      description: URL или идентификатор изображения профиля.
ProfileEpisodeNotification:
  allOf:
  - $ref: ./notifications.yaml#/ProfileNotification
  - type: object
    properties:
      episode:
        $ref: ./episodes.yaml#/EpisodeCompact
        description: Связанный эпизод.
ProfileFriendNotification:
  allOf:
  - $ref: ./notifications.yaml#/ProfileNotification
  - type: object
    properties:
      by_profile:
        $ref: '#/ProfileSlim'
        description: Профиль, который инициировал заявку или действие.
      status:
        $ref: ./enums.yaml#/ProfileFriendNotification_Status
        description: Текущий статус объекта.
ProfileGenre:
  type: object
  properties:
    name:
      type: string
      description: Отображаемое название.
    percentage:
      type: integer
      format: int32
      description: Доля/процент, рассчитанный для жанра в статистике профиля.
ProfileHealthStatusResponse:
  allOf:
  - $ref: ./common.yaml#/Response
  - type: object
    properties:
      ban_count:
        type: integer
        format: int64
        description: Количество элементов категории «ban».
      ban_for_3_month_count:
        type: integer
        format: int64
        description: Количество элементов категории «ban for3 month».
      blog_mute_expires:
        type: integer
        format: int64
        description: Временная метка «blog mute expires» в формате API.
      blog_suspension_expires:
        type: integer
        format: int64
        description: Временная метка «blog suspension expires» в формате API.
      last_ban_expires:
        type: integer
        format: int64
        description: Временная метка «last ban expires» в формате API.
      last_ban_timestamp:
        type: integer
        format: int64
        description: Время последней блокировки аккаунта в формате API.
ProfileInfoResponse:
  allOf:
  - $ref: ./common.yaml#/Response
  - type: object
    properties:
      channel_id:
        type:
        - integer
        - 'null'
        format: int64
        description: Идентификатор канала.
      is_perm_banned:
        type: boolean
        description: Профиль заблокирован без ограничения по сроку.
      is_sponsor:
        type: boolean
        description: У профиля активен статус спонсора.
      privilege_level:
        type: integer
        format: int64
        description: Уровень системных привилегий профиля.
      rating_score:
        type: integer
        format: int32
        description: Репутация/рейтинговый балл профиля.
      sponsorship_expires:
        type: integer
        format: int64
        description: Временная метка «sponsorship expires» в формате API.
ProfileProcessRequest:
  type: object
  properties:
    ban_expires:
      type:
      - integer
      - 'null'
      format: int64
      description: Временная метка «ban expires» в формате API.
    ban_reason:
      type: string
      description: Причина блокировки.
    is_banned:
      type: boolean
      description: Профиль заблокирован.
ProfileRelatedReleaseNotification:
  allOf:
  - $ref: ./notifications.yaml#/ProfileNotification
  - type: object
    properties:
      release:
        $ref: ./releases.yaml#/ReleaseCompact
        description: Связанный релиз.
ProfileResponse:
  allOf:
  - $ref: ./common.yaml#/Response
  - type: object
    properties:
      is_my_profile:
        type: boolean
        description: Ответ относится к профилю текущей сессии.
      profile:
        $ref: '#/Profile'
        description: Связанный профиль пользователя.
ProfileRole:
  allOf:
  - $ref: '#/ProfileCompact'
  - type: object
    properties:
      is_online:
        type: boolean
        description: Профиль сейчас отмечен онлайн.
      roles:
        type: array
        items:
          $ref: '#/RoleDto'
        description: Роли профиля.
ProfileSlim:
  type: object
  description: 'Минимальное представление профиля: идентификатор, логин и аватар.'
  properties:
    avatar:
      type: string
      description: URL или идентификатор изображения профиля.
    id:
      type: integer
      format: int64
      description: Уникальный идентификатор.
    login:
      type: string
      description: Логин профиля.
ProfileWatchDynamics:
  type: object
  description: Одна точка статистики активности просмотра профиля.
  properties:
    count:
      type: integer
      format: int32
      description: Числовое значение статистики для текущей точки.
    day:
      type: integer
      format: int32
      description: Номер дня/интервала в серии статистики просмотров.
    id:
      type: integer
      format: int64
      description: Уникальный идентификатор.
    timestamp:
      type: integer
      format: int64
      description: Временная метка.
RoleDto:
  type: object
  description: Роль профиля и её оформление.
  properties:
    id:
      type: integer
      format: int64
      description: Уникальный идентификатор.
    name:
      type: string
      description: Отображаемое название.
    color:
      type: string
      description: Цвет роли в строковом формате клиента.
