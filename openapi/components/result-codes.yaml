CommonResult:
  type: integer
  format: int32
  description: Общие коды результата, которые могут встречаться в ответах API. Имена приведены в форме CommonResult из AnixartJS.
    В APK v10 базовый Response называет 0/1/402/403 как SUCCESSFUL/FAILED/BANNED/PERM_BANNED; отдельной именованной константы
    401 в базовом Response APK не обнаружено.
  enum:
  - 0
  - 1
  - 401
  - 402
  - 403
  x-enum-varnames:
  - Ok
  - UnexpectedError
  - Unauthorized
  - InvalidUserAgent
  - PermBan
  x-enum-descriptions:
    '0': 'Операция выполнена успешно. APK: SUCCESSFUL.'
    '1': 'Непредвиденная или общая ошибка. APK: FAILED.'
    '401': Пользовательская сессия отсутствует или не авторизована. Значение присутствует в AnixartJS CommonResult.
    '402': 'Клиент или User-Agent отклонён сервером. AnixartJS: InvalidUserAgent; APK v10 использует имя BANNED.'
    '403': 'Постоянная блокировка. APK: PERM_BANNED.'
  x-apk-constant-names:
  - SUCCESSFUL
  - FAILED
  - null
  - BANNED
  - PERM_BANNED
  example: 0
