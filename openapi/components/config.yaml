AnixPlayerConfigResponse:
  allOf:
  - $ref: ./common.yaml#/Response
  - type: object
    properties:
      download_links:
        type: object
        additionalProperties:
          type: string
        description: Список ссылок или зеркал для загрузки AnixPlayer.
      last_version_code:
        type: integer
        format: int64
        description: Код последней доступной версии.
      whats_new:
        type: string
        description: Текст с изменениями последней версии.
ConfigUrlsResponse:
  type: object
  description: Адреса API и внешних сервисов, получаемые клиентом при запуске.
  properties:
    api_urls:
      type: array
      uniqueItems: true
      items:
        type: string
      description: Базовые адреса API/зеркал, доступные клиенту.
    consent_required:
      type: boolean
      description: Перед продолжением клиент должен получить согласие пользователя.
    editor_url:
      type: string
      description: Адрес веб-редактора или сервиса редактора.
    google_auth_available:
      type: boolean
      description: Авторизация через Google доступна.
    should_use_mirror_urls:
      type: boolean
      description: Клиенту следует использовать зеркальные адреса API.
    static_domain:
      type: string
      description: Домен статических ресурсов.
    telegram_auth_available:
      type: boolean
      description: Авторизация через Telegram доступна.
    vk_auth_available:
      type: boolean
      description: Авторизация через VK доступна.
    yandex_auth_available:
      type: boolean
      description: Авторизация через Yandex доступна.
