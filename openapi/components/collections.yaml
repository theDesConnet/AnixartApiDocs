Collection:
  type: object
  description: Пользовательская коллекция релизов.
  properties:
    comment_count:
      type: integer
      format: int64
      description: Количество комментариев.
    creation_date:
      type: integer
      format: int64
      description: Время создания объекта в формате API.
    creator:
      $ref: ./profiles.yaml#/Profile
      description: Профиль автора коллекции.
    delete:
      type: boolean
      description: Объект помечен как удалённый/подлежащий удалению.
    favorites_count:
      type: integer
      format: int32
      description: Количество добавлений в избранное.
    id:
      type: integer
      format: int64
      description: Уникальный идентификатор.
    is_favorite:
      type: boolean
      description: Объект находится в избранном текущего профиля.
    is_private:
      type: boolean
      description: Коллекция доступна только в приватном режиме.
    last_update_date:
      type: integer
      format: int64
      description: Время последнего обновления объекта в формате API.
    title:
      type: string
      description: Заголовок.
    description:
      type: string
      description: Текстовое описание.
    image:
      type: string
      description: URL или идентификатор изображения.
    releases:
      type: array
      items:
        $ref: ./releases.yaml#/Release
      description: Релизы в коллекции или ответе.
    cover_animation:
      type:
      - string
      - "null"
      description: URL анимации обложки коллекции.
    release_count:
      type:
      - integer
      - "null"
      format: int64
    watched_count:
      type:
      - integer
      - "null"
      format: int64
    has_release:
      type:
      - boolean
      - "null"
      description: Признак наличия выбранного релиза в коллекции.
    releases_preview:
      type:
      - array
      - "null"
      items:
        $ref: ./collections.yaml#/CollectionReleasePreview
CollectionCompact:
  type: object
  properties:
    id:
      type: integer
      format: int64
      description: Уникальный идентификатор.
    image:
      type: string
      description: URL или идентификатор изображения.
    title:
      type: string
      description: Заголовок.
CollectionCreateEditRequest:
  type: object
  properties:
    description:
      type: string
      description: Текстовое описание.
    is_private:
      type: boolean
      description: Коллекция доступна только в приватном режиме.
    releases:
      type: array
      items:
        type:
        - integer
        - 'null'
        format: int64
      description: Релизы в коллекции или ответе.
    title:
      type: string
      description: Заголовок.
CollectionCreateEditResponse:
  allOf:
  - $ref: ./common.yaml#/Response
  - type: object
    properties:
      collection:
        $ref: '#/Collection'
        description: Связанная коллекция.
      code:
        anyOf:
        - $ref: ./result-codes.yaml#/CommonResult
        - $ref: ./result-codes.yaml#/CollectionCreateEditResult
        description: 'Код результата: общий `CommonResult` либо `CollectionCreateEditResult` для ошибок этой операции.'
        example: 0
  x-result-enum: '#/components/schemas/CollectionCreateEditResult'
CollectionDeleteResponse:
  allOf:
  - $ref: ./common.yaml#/Response
  - type: object
    properties:
      code:
        anyOf:
        - $ref: ./result-codes.yaml#/CommonResult
        - $ref: ./result-codes.yaml#/CollectionDeleteResult
        description: 'Код результата: общий `CommonResult` либо `CollectionDeleteResult` для ошибок этой операции.'
        example: 0
  x-result-enum: '#/components/schemas/CollectionDeleteResult'
CollectionEditImageResponse:
  allOf:
  - $ref: ./common.yaml#/Response
  - type: object
    properties:
      url:
        type: string
        description: URL ресурса.
      code:
        anyOf:
        - $ref: ./result-codes.yaml#/CommonResult
        - $ref: ./result-codes.yaml#/CollectionEditImageResult
        description: 'Код результата: общий `CommonResult` либо `CollectionEditImageResult` для ошибок этой операции.'
        example: 0
  x-result-enum: '#/components/schemas/CollectionEditImageResult'
CollectionResponse:
  allOf:
  - $ref: ./common.yaml#/Response
  - type: object
    properties:
      collection:
        $ref: '#/Collection'
        description: Связанная коллекция.
      completed_count:
        type: integer
        format: int64
        description: Количество профилей со статусом «Просмотрено».
      dropped_count:
        type: integer
        format: int64
        description: Количество профилей со статусом «Брошено».
      hold_on_count:
        type: integer
        format: int64
        description: Количество профилей со статусом «Отложено».
      plan_count:
        type: integer
        format: int64
        description: Количество профилей со статусом «В планах».
      watching_count:
        type: integer
        format: int64
        description: Количество профилей со статусом «Смотрю».
      code:
        anyOf:
        - $ref: ./result-codes.yaml#/CommonResult
        - $ref: ./result-codes.yaml#/CollectionResult
        description: 'Код результата: общий `CommonResult` либо `CollectionResult` для ошибок этой операции.'
        example: 0
  x-result-enum: '#/components/schemas/CollectionResult'
FavoriteCollectionAddResponse:
  allOf:
  - $ref: ./common.yaml#/Response
  - type: object
    properties:
      code:
        anyOf:
        - $ref: ./result-codes.yaml#/CommonResult
        - $ref: ./result-codes.yaml#/FavoriteCollectionAddResult
        description: 'Код результата: общий `CommonResult` либо `FavoriteCollectionAddResult` для ошибок этой операции.'
        example: 0
  x-result-enum: '#/components/schemas/FavoriteCollectionAddResult'
FavoriteCollectionDeleteResponse:
  allOf:
  - $ref: ./common.yaml#/Response
  - type: object
    properties:
      code:
        anyOf:
        - $ref: ./result-codes.yaml#/CommonResult
        - $ref: ./result-codes.yaml#/FavoriteCollectionDeleteResult
        description: 'Код результата: общий `CommonResult` либо `FavoriteCollectionDeleteResult` для ошибок этой операции.'
        example: 0
  x-result-enum: '#/components/schemas/FavoriteCollectionDeleteResult'
ReleaseAddCollectionResponse:
  allOf:
  - $ref: ./common.yaml#/Response
  - type: object
    properties:
      code:
        anyOf:
        - $ref: ./result-codes.yaml#/CommonResult
        - $ref: ./result-codes.yaml#/ReleaseAddCollectionResult
        description: 'Код результата: общий `CommonResult` либо `ReleaseAddCollectionResult` для ошибок этой операции.'
        example: 0
      collection:
        anyOf:
        - $ref: ./collections.yaml#/Collection
        - type: "null"
        description: Обновлённая коллекция; может быть null.
  x-result-enum: '#/components/schemas/ReleaseAddCollectionResult'
CollectionReleasePreview:
  type: object
  properties:
    id:
      type: integer
      format: int64
    image:
      type: string
  description: Краткие данные релиза в превью коллекции.
CollectionHubResponse:
  allOf:
  - $ref: ./common.yaml#/Response
  - type: object
    properties:
      my:
        type:
        - array
        - "null"
        items:
          $ref: ./collections.yaml#/Collection
      my_count:
        type: integer
        format: int64
      recommended:
        type:
        - array
        - "null"
        items:
          $ref: ./collections.yaml#/Collection
      weekly:
        type:
        - array
        - "null"
        items:
          $ref: ./collections.yaml#/Collection
  description: Свои коллекции, их количество, рекомендации и подборка недели.
ReleaseRemoveCollectionResponse:
  allOf:
  - $ref: ./common.yaml#/Response
  - type: object
    properties:
      code:
        anyOf:
        - $ref: ./result-codes.yaml#/CommonResult
        - $ref: ./result-codes.yaml#/ReleaseRemoveCollectionResult
      collection:
        anyOf:
        - $ref: ./collections.yaml#/Collection
        - type: "null"
  x-result-enum: "#/components/schemas/ReleaseRemoveCollectionResult"
  x-response-constants:
  - name: COLLECTION_DELETED
    type: int
    value: 6
  - name: COLLECTION_NOT_FOUND
    type: int
    value: 2
  - name: COLLECTION_NOT_OWNED
    type: int
    value: 3
  - name: INVALID_RELEASE
    type: int
    value: 4
  - name: LAST_RELEASE
    type: int
    value: 7
  - name: RELEASE_NOT_IN_COLLECTION
    type: int
    value: 5
