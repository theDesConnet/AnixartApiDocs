Collection:
  type: object
  description: Пользовательская коллекция релизов.
  properties:
    comment_count:
      type: integer
      format: int64
      description: Количество комментариев.
    creation_date:
      type: integer
      format: int64
      description: Время создания объекта в формате API.
    creator:
      $ref: ./profiles.yaml#/Profile
      description: Профиль автора коллекции.
    delete:
      type: boolean
      description: Объект помечен как удалённый/подлежащий удалению.
    favorites_count:
      type: integer
      format: int32
      description: Количество добавлений в избранное.
    id:
      type: integer
      format: int64
      description: Уникальный идентификатор.
    is_favorite:
      type: boolean
      description: Объект находится в избранном текущего профиля.
    is_private:
      type: boolean
      description: Коллекция доступна только в приватном режиме.
    last_update_date:
      type: integer
      format: int64
      description: Время последнего обновления объекта в формате API.
    title:
      type: string
      description: Заголовок.
    description:
      type: string
      description: Текстовое описание.
    image:
      type: string
      description: URL или идентификатор изображения.
    releases:
      type: array
      items:
        $ref: ./releases.yaml#/Release
      description: Релизы в коллекции или ответе.
CollectionCompact:
  type: object
  properties:
    id:
      type: integer
      format: int64
      description: Уникальный идентификатор.
    image:
      type: string
      description: URL или идентификатор изображения.
    title:
      type: string
      description: Заголовок.
CollectionCreateEditRequest:
  type: object
  properties:
    description:
      type: string
      description: Текстовое описание.
    is_private:
      type: boolean
      description: Коллекция доступна только в приватном режиме.
    releases:
      type: array
      items:
        type:
        - integer
        - 'null'
        format: int64
      description: Релизы в коллекции или ответе.
    title:
      type: string
      description: Заголовок.
CollectionCreateEditResponse:
  allOf:
  - $ref: ./common.yaml#/Response
  - type: object
    properties:
      collection:
        $ref: '#/Collection'
        description: Связанная коллекция.
      code:
        anyOf:
        - $ref: ./result-codes.yaml#/CommonResult
        - $ref: ./result-codes.yaml#/CollectionCreateEditResult
        description: 'Код результата: общий `CommonResult` либо `CollectionCreateEditResult` для ошибок этой операции.'
        example: 0
  x-result-enum: '#/components/schemas/CollectionCreateEditResult'
CollectionDeleteResponse:
  allOf:
  - $ref: ./common.yaml#/Response
  - type: object
    properties:
      code:
        anyOf:
