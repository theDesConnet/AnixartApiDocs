  allOf:
  - $ref: ./common.yaml#/Response
  - type: object
    properties:
      url:
        type: string
        description: URL ресурса.
      code:
        anyOf:
        - $ref: ./result-codes.yaml#/CommonResult
        - $ref: ./result-codes.yaml#/CollectionEditImageResult
        description: 'Код результата: общий `CommonResult` либо `CollectionEditImageResult` для ошибок этой операции.'
        example: 0
  x-result-enum: '#/components/schemas/CollectionEditImageResult'
CollectionResponse:
  allOf:
  - $ref: ./common.yaml#/Response
  - type: object
    properties:
      collection:
        $ref: '#/Collection'
        description: Связанная коллекция.
      completed_count:
        type: integer
        format: int64
        description: Количество профилей со статусом «Просмотрено».
      dropped_count:
        type: integer
        format: int64
        description: Количество профилей со статусом «Брошено».
      hold_on_count:
        type: integer
        format: int64
        description: Количество профилей со статусом «Отложено».
      plan_count:
        type: integer
        format: int64
        description: Количество профилей со статусом «В планах».
      watching_count:
        type: integer
        format: int64
        description: Количество профилей со статусом «Смотрю».
      code:
        anyOf:
        - $ref: ./result-codes.yaml#/CommonResult
        - $ref: ./result-codes.yaml#/CollectionResult
        description: 'Код результата: общий `CommonResult` либо `CollectionResult` для ошибок этой операции.'
        example: 0
  x-result-enum: '#/components/schemas/CollectionResult'
