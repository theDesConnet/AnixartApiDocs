Interesting:
  type: object
  description: Карточка из блока рекомендаций «Интересное».
  properties:
    id:
      type: integer
      format: int64
      description: Уникальный идентификатор.
    is_hidden:
      type: boolean
      description: Карточка скрыта в интерфейсе.
    type:
      type: integer
      format: int32
      description: Числовой тип карточки блока «Интересное».
    title:
      type: string
      description: Заголовок.
    description:
      type: string
      description: Текстовое описание.
    image:
      type: string
      description: URL или идентификатор изображения.
    action:
      type: string
      description: Действие, которое клиент выполняет при выборе карточки.
    image_animation:
      type:
      - string
      - "null"
      description: URL анимации изображения блока рекомендаций.
LatestArticleResponse:
  allOf:
  - $ref: ./common.yaml#/Response
  - type: object
    properties:
      article_id:
        type:
        - integer
        - 'null'
        format: int64
        description: Идентификатор статьи.
DiscoverHubResponse:
  allOf:
  - $ref: ./common.yaml#/Response
  - type: object
    properties:
      collections:
        type:
        - array
        - "null"
        items:
          $ref: ./collections.yaml#/Collection
      collections_page:
        type: integer
        format: int32
      collections_page_count:
        type: integer
        format: int32
      comments:
        type:
        - array
        - "null"
        items:
          $ref: ./comments.yaml#/ReleaseComment
      discussing:
        type:
        - array
        - "null"
        items:
          $ref: ./releases.yaml#/Release
      interesting:
        type:
        - array
        - "null"
        items:
          $ref: ./feed.yaml#/Interesting
      recommendations:
        type:
        - array
        - "null"
        items:
          $ref: ./releases.yaml#/Release
      recommendations_page:
        type: integer
        format: int32
      watching:
        type:
        - array
        - "null"
        items:
          $ref: ./releases.yaml#/Release
  description: Объединённые подборки Discover. Поля comments, discussing и interesting являются массивами, а не объектами пагинации.
