Channel:
  type: object
  description: Канал или персональный блог Anixart.
  properties:
    articleCount:
      type: integer
      format: int32
      description: Количество статей.
    avatar:
      type: string
      description: URL или идентификатор изображения профиля.
    badgeId:
      type:
      - integer
      - 'null'
      format: int64
      description: Идентификатор значка.
    badgeName:
      type: string
      description: Отображаемое название значка.
    badgeType:
      type:
      - integer
      - 'null'
      format: int32
      description: Тип значка (статический или анимированный).
    badgeUrl:
      type: string
      description: URL изображения или анимации значка.
    blockExpireDate:
      type:
      - integer
      - 'null'
      format: int64
      description: Временная метка «block expire date» в формате API.
    blockReason:
      type: string
      description: Причина блокировки в канале.
    blogProfileId:
      type:
      - integer
      - 'null'
      format: int64
      description: Идентификатор профиля-владельца блога.
    cover:
      type: string
      description: URL обложки канала.
    creationDate:
      type: integer
      format: int64
      description: Время создания объекта в формате API.
    episodeChannelWidgetSort:
      type: integer
      format: int32
      description: Способ сортировки статей в виджете эпизодов.
      enum:
      - 0
      - 1
      x-enum-varnames:
      - CHRONOLOGY
      - POPULARITY
    id:
      type: integer
      format: int64
      description: Уникальный идентификатор.
    isArticleSuggestionEnabled:
      type: boolean
      description: В канале разрешено отправлять предложения статей.
    isBlocked:
      type: boolean
      description: Объект заблокирован для текущего профиля.
    isBlog:
      type: boolean
      description: Канал является персональным блогом.
    isCommentingEnabled:
      type: boolean
      description: Комментарии для объекта включены.
    isDeleted:
      type: boolean
      description: Объект помечен удалённым.
    isLinkedToType:
      type: boolean
      description: Канал связан с конкретной озвучкой/даббером.
    isMuted:
      type: boolean
      description: Для объекта включён режим mute.
    isPermBlocked:
      type: boolean
      description: Блокировка является постоянной.
    isSubscribed:
      type: boolean
      description: Текущий профиль подписан на канал.
    isVerified:
      type: boolean
      description: Профиль/канал подтверждён.
    lastArticleDate:
      type: integer
      format: int64
      description: Временная метка «last article date» в формате API.
    lastUpdateDate:
      type: integer
      format: int64
      description: Время последнего обновления объекта в формате API.
    permission:
      type: integer
      format: int32
      description: Уровень прав пользователя в канале.
    recentArticleCount:
      type: integer
      format: int32
      description: Количество недавних статей.
    subscriberCount:
      type: integer
      format: int32
      description: Количество подписчиков.
    title:
      type: string
      description: Заголовок.
    description:
      type: string
      description: Текстовое описание.
    isEpisodeChannelWidgetEnabled:
      type: boolean
      description: В канале включён виджет последних эпизодов.
    episodeChannelWidgetPopularityPeriod:
      type: integer
      format: int32
      description: Период, по которому виджет рассчитывает популярность статей.
      enum:
      - 0
      - 1
      - 2
      x-enum-varnames:
      - 24_HOURS
      - 3_DAYS
      - 7_DAYS
    episodeChannelWidgetArticleCount:
      type: integer
      format: int32
      description: Количество статей в виджете эпизодов.
  x-response-constants:
  - name: AUTO_HIDE_THRESHOLD
    type: int
    value: 3
  - name: MAX_ARTICLE_COUNT
    type: int
    value: 4
  - name: MIN_ARTICLE_COUNT
    type: int
    value: 2
  - name: PERIOD_24H
    type: int
    value: 0
  - name: PERIOD_3DAYS
    type: int
    value: 1
  - name: PERIOD_7DAYS
    type: int
    value: 2
  - name: SORT_CHRONOLOGY
    type: int
    value: 0
  - name: SORT_POPULARITY
    type: int
    value: 1
