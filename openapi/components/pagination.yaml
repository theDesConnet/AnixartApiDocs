PageableResponse:
  allOf:
  - $ref: ./common.yaml#/Response
  - type: object
    properties:
      content:
        type: array
        items: {}
        description: Элементы текущей страницы. Конкретный тип задаётся схемой ответа метода.
      currentPage:
        type: integer
        format: int32
        description: Номер текущей страницы, начиная с `0`.
      totalCount:
        type: integer
        format: int64
        description: Общее количество элементов во всей выборке.
      totalPageCount:
        type: integer
        format: int32
        description: Общее количество страниц.
      code:
        type: integer
        format: int32
        description: Код результата постраничного запроса. `0` - успешно; остальные значения обозначают ошибку или ограничение.
        example: 0
  x-response-constants:
  - name: INVALID_QUERY
    type: int
    value: 0
  description: Базовая модель постраничного ответа.
  x-note: Константа INVALID_QUERY=0 присутствует в клиентском классе, но совпадает с базовым SUCCESSFUL=0; её назначение как
    кода ответа не подтверждено.
