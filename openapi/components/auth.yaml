      available:
        type: boolean
        description: Запрошенное значение свободно и доступно.
      suggested_logins:
        type: array
        items:
          type: string
        description: Свободные варианты логина, предложенные сервером.
      code:
        anyOf:
        - $ref: ./result-codes.yaml#/CommonResult
        - $ref: ./result-codes.yaml#/CheckLoginResult
        description: 'Код результата: общий `CommonResult` либо `CheckLoginResult` для ошибок этой операции.'
        example: 0
  x-result-enum: '#/components/schemas/CheckLoginResult'
