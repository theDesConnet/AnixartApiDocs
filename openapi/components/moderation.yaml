ProfileEnforcement:
  type: object
  description: Ограничение или модерационное действие в отношении профиля/контента.
  properties:
    appeal_expires_timestamp:
      type:
      - integer
      - 'null'
      format: int64
      description: Время, до которого доступна апелляция, в формате API.
    appeal_process_message:
      type: string
      description: Комментарий по результату рассмотрения апелляции.
    appeal_process_timestamp:
      type:
      - integer
      - 'null'
      format: int64
      description: Время обработки апелляции в формате API.
    appeal_status:
      $ref: ./enums.yaml#/ProfileEnforcement_AppealStatus
      description: Текущий статус апелляции.
    appeal_submit_timestamp:
      type:
      - integer
      - 'null'
      format: int64
      description: Время отправки апелляции в формате API.
    appeal_type:
      $ref: ./enums.yaml#/ProfileEnforcement_AppealType
      description: Доступный тип апелляции.
    creation_timestamp:
      type: integer
      format: int64
      description: Время создания ограничения в формате API.
    entity_type:
      $ref: ./enums.yaml#/ProfileEnforcement_EntityType
      description: Тип объекта, к которому применено ограничение.
    id:
      type: integer
      format: int64
      description: Уникальный идентификатор.
    is_revoked:
      type: boolean
      description: Ограничение отменено.
    reason:
      type: string
      description: Причина действия или ограничения.
    revocation_timestamp:
      type:
      - integer
      - 'null'
      format: int64
      description: Время отмены ограничения в формате API.
    target_entity_type:
      $ref: ./enums.yaml#/ProfileEnforcement_TargetEntityType
      description: Тип целевого объекта, связанного с ограничением.
ProfileEnforcementAppealRequest:
  type: object
  properties:
    message:
      type: string
      description: Текст апелляции пользователя.
ProfileEnforcementAppealResponse:
  allOf:
  - $ref: ./common.yaml#/Response
  - type: object
    properties: {}
ProfileEnforcementResponse:
  allOf:
  - $ref: ./common.yaml#/Response
  - type: object
    properties:
      enforcement:
        $ref: '#/ProfileEnforcement'
        description: Информация о конкретном ограничении аккаунта/контента.
ReleaseVideoAppealRequest:
  type: object
  properties:
    category_id:
      type: integer
      format: int64
      description: Идентификатор категории.
    release_id:
      type: integer
      format: int64
      description: Идентификатор релиза.
    title:
      type: string
      description: Заголовок.
    url:
      type: string
      description: URL ресурса.
ReleaseVideoAppealResponse:
  allOf:
  - $ref: ./common.yaml#/Response
  - type: object
    properties:
      code:
        anyOf:
        - $ref: ./result-codes.yaml#/CommonResult
        - $ref: ./result-codes.yaml#/ReleaseVideoAppealResult
        description: 'Код результата: общий `CommonResult` либо `ReleaseVideoAppealResult` для ошибок этой операции.'
        example: 0
  x-result-enum: '#/components/schemas/ReleaseVideoAppealResult'
ReportReason:
  type: object
  properties:
    id:
      type: integer
      format: int64
      description: Уникальный идентификатор.
    name:
      type: string
      description: Отображаемое название.
ReportRequest:
  type: object
  properties:
    entity_id:
      description: Идентификатор связанного объекта «entity».
    message:
      type: string
      description: Дополнительное пояснение к жалобе.
    reason:
      type: integer
      format: int64
      description: Идентификатор причины жалобы.
ReportResponse:
  allOf:
  - $ref: ./common.yaml#/Response
  - type: object
    properties:
      code:
        anyOf:
        - $ref: ./result-codes.yaml#/CommonResult
        - $ref: ./result-codes.yaml#/ReportResult
        description: 'Код результата: общий `CommonResult` либо `ReportResult` для ошибок этой операции.'
        example: 0
  x-result-enum: '#/components/schemas/ReportResult'
